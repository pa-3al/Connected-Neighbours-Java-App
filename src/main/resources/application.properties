# Application Configuration

# Security: Use HTTPS in production
app.update.checkUrl=https://localhost:8000/api/updates/latest
app.update.timeout=30

# Plugins
app.plugins.path=plugins

# Database (H2 embedded)
app.db.url=jdbc:h2:./data/neighborhood;AUTO_SERVER=TRUE
app.db.user=sa
app.db.password=

# Sync
app.sync.url=https://localhost:8000/api/sync
app.sync.interval=60
