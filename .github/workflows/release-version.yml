name: Release versioned update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve Maven version
        id: maven
        shell: pwsh
        run: |
          $version = (mvn -q -DforceStdout help:evaluate "-Dexpression=project.version").Trim()
          $artifactId = (mvn -q -DforceStdout help:evaluate "-Dexpression=project.artifactId").Trim()
          if (-not $version) {
            throw "Maven version is empty"
          }
          if (-not $artifactId) {
            throw "Maven artifactId is empty"
          }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $version) {
              throw "Tag $env:GITHUB_REF_NAME does not match pom.xml version $version"
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifactId=$artifactId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests

      - name: Prepare update site
        shell: pwsh
        env:
          VERSION: ${{ steps.maven.outputs.version }}
          ARTIFACT_ID: ${{ steps.maven.outputs.artifactId }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $remote = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          $site = Join-Path $PWD "site"
          if (Test-Path $site) {
            Remove-Item -Recurse -Force $site
          }

          git ls-remote --exit-code --heads origin gh-pages | Out-Null
          if ($LASTEXITCODE -eq 0) {
            git clone --branch gh-pages --single-branch $remote $site
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone gh-pages"
            }
          } else {
            New-Item -ItemType Directory -Force $site | Out-Null
            Push-Location $site
            git init
            git checkout -b gh-pages
            git remote add origin $remote
            Pop-Location
          }

          $updatesRoot = Join-Path $site "api/updates"
          $versionDir = Join-Path $updatesRoot $env:VERSION
          New-Item -ItemType Directory -Force $versionDir | Out-Null

          $jarName = "$env:ARTIFACT_ID-$env:VERSION.jar"
          $sourceJar = Join-Path $PWD "target/updates/$env:VERSION/$jarName"
          $targetJar = Join-Path $versionDir $jarName
          if (-not (Test-Path $sourceJar)) {
            throw "Missing built update jar: $sourceJar"
          }
          Copy-Item $sourceJar $targetJar -Force

          $repoParts = $env:GITHUB_REPOSITORY.Split("/")
          $baseUrl = "https://$($repoParts[0]).github.io/$($repoParts[1])/api/updates"
          $latest = [ordered]@{
            version = $env:VERSION
            downloadUrl = "$baseUrl/$env:VERSION/$jarName"
            description = "Release $env:VERSION"
            changelog = ""
            releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            mandatory = $false
            minVersion = "1.0.0"
            patchUrl = $null
          }
          $latest | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $updatesRoot "latest")
          "" | Set-Content -Encoding utf8 (Join-Path $site ".nojekyll")

      - name: Generate differential patches
        shell: bash
        env:
          VERSION: ${{ steps.maven.outputs.version }}
          ARTIFACT_ID: ${{ steps.maven.outputs.artifactId }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import os

          version = os.environ["VERSION"]
          artifact_id = os.environ["ARTIFACT_ID"]
          updates_root = Path("site/api/updates")
          new_jar = updates_root / version / f"{artifact_id}-{version}.jar"
          patch_dir = updates_root / version / "patches"
          patch_dir.mkdir(parents=True, exist_ok=True)

          with ZipFile(new_jar) as new_zip:
              new_entries = {info.filename: info for info in new_zip.infolist() if not info.is_dir()}
              for old_jar in updates_root.glob(f"*/{artifact_id}-*.jar"):
                  old_version = old_jar.parent.name
                  if old_version == version:
                      continue
                  with ZipFile(old_jar) as old_zip:
                      old_entries = {info.filename: info for info in old_zip.infolist() if not info.is_dir()}
                      changed = [
                          name for name, info in new_entries.items()
                          if name not in old_entries
                          or old_entries[name].CRC != info.CRC
                          or old_entries[name].file_size != info.file_size
                      ]
                      deleted = sorted(set(old_entries) - set(new_entries))

                      patch_path = patch_dir / f"{old_version}-to-{version}.jar"
                      if not changed and not deleted:
                          if patch_path.exists():
                              patch_path.unlink()
                          continue

                      with ZipFile(patch_path, "w", ZIP_DEFLATED) as patch_zip:
                          for name in changed:
                              info = new_entries[name]
                              copy_info = ZipInfo(info.filename, info.date_time)
                              copy_info.compress_type = ZIP_DEFLATED
                              copy_info.external_attr = info.external_attr
                              patch_zip.writestr(copy_info, new_zip.read(name))
                          if deleted:
                              patch_zip.writestr("META-INF/update-delete.list", "\n".join(deleted) + "\n")
          PY

      - name: Upload update artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ steps.maven.outputs.version }}
          path: site/api/updates/${{ steps.maven.outputs.version }}

      - name: Publish to gh-pages
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Push-Location site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/updates .nojekyll
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No update site changes to publish"
            Pop-Location
            exit 0
          }
          git commit -m "Publish update ${{ steps.maven.outputs.version }}"
          git push origin gh-pages
          Pop-Location
